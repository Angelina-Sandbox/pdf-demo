<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 微信、LINE、FB 分享時顯示的標題與描述 -->
    <meta property="og:title" content="《千橡》2025年秋">
    <meta property="og:description" content="CCCA JOURNAL No.80">
    
    <!-- 分享時顯示的縮圖網址 -->
    <meta property="og:image" content="https://angelina-sandbox.github.io/pdf-demo/images/cover.jpg">
    
    <!-- 網頁的網址 -->
    <meta property="og:url" content="https://angelina-sandbox.github.io/pdf-demo/">
    
    <!-- 卡片類型 -->
    <meta property="og:type" content="website">
    
    <title>Angela-Sandbox - PDF Magazine Demo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* 單純乾淨的滿版 PDF 閱讀視窗 */
        .magazine-view {
            width: 100%;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 一進來直接滿版顯示 PDF，絕不囉唆、不需要點任何按鈕 -->
    <iframe 
        src="pdf/CCCA_Magazine_Perfect_Bookmarks_compressed.pdf#toolbar=1&navpanes=0&view=FitH" 
        class="magazine-view" 
        type="application/pdf">
        <p>您的浏览器不支持预览，请 <a href="pdf/CCCA_Magazine_Perfect_Bookmarks_compressed.pdf">点击此处下载杂志 PDF</a>。</p>
    </iframe>

</body>
</html>
