<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 微信、LINE、FB 分享時顯示的標題與描述 -->
    <meta property="og:title" content="《千橡》2025年秋">
    <meta property="og:description" content="CCCA JOURNAL No.80">
    
    <!-- 分享時顯示的縮圖網址 -->
    <meta property="og:image" content="https://angelina-sandbox.github.io/pdf-demo/images/cover.jpg">
    
    <!-- 網頁的網址 -->
    <meta property="og:url" content="https://angelina-sandbox.github.io/pdf-demo/">
    
    <!-- 卡片類型 -->
    <meta property="og:type" content="website">
    
    <title>《千橡》2025年秋 - CCCA JOURNAL No.80</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 20px;
            color: #ffffff;
        }

        .container img {
            width: 180px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            margin-bottom: 20px;
        }

        .container h1 {
            font-size: 18px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .container p {
            font-size: 13px;
            color: #888;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background-color: #007aff;
            color: white;
            padding: 14px 32px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="images/cover.jpg" alt="《千橡》封面">
        <h1>《千橡》2025年秋</h1>
        <p>CCCA JOURNAL No.80</p>
        <!-- 點擊後直接用手機原生最高效能的方式打開 PDF，保證大小完美、絕對可上下捲動 -->
        <a href="pdf/CCCA_Magazine_Perfect_Bookmarks_compressed.pdf" class="btn">点击开始阅读杂志</a>
    </div>

</body>
</html>
