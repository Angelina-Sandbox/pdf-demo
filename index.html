<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 微信、LINE、FB 分享時顯示的標題與描述 -->
    <meta property="og:title" content="《千橡》2025年秋">
    <meta property="og:description" content="CCCA JOURNAL No.80">
    
    <!-- 分享時顯示的縮圖網址 -->
    <meta property="og:image" content="https://angelina-sandbox.github.io/pdf-demo/images/cover.jpg">
    
    <!-- 網頁的網址 -->
    <meta property="og:url" content="https://angelina-sandbox.github.io/pdf-demo/">
    
    <!-- 卡片類型 -->
    <meta property="og:type" content="website">
    
    <title>《千橡》2025年秋 - CCCA JOURNAL No.80</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* 滿版 PDF 雲端檢視器容器 */
        .pdf-viewer-frame {
            width: 100%;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 一開網頁直接載入 PDF.js 檢視器：電腦自動雙頁、手機自動單頁，支援雲端線上串流 -->
    <iframe 
        src="https://mozilla.github.io/pdf.js/web/viewer.html?file=https://angelina-sandbox.github.io/pdf-demo/pdf/CCCA_Magazine_Perfect_Bookmarks_compressed.pdf" 
        class="pdf-viewer-frame" 
        type="application/pdf">
        <p>您的浏览器不支持预览，请 <a href="pdf/CCCA_Magazine_Perfect_Bookmarks_compressed.pdf">点击此处下载杂志 PDF</a>。</p>
    </iframe>

</body>
</html>
