<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- 微信、LINE、FB 分享時顯示的標題與描述 -->
    <meta property="og:title" content="《千橡》2025年秋">
    <meta property="og:description" content="CCCA JOURNAL No.80">
    
    <!-- 分享時顯示的縮圖網址 -->
    <meta property="og:image" content="https://angelina-sandbox.github.io/pdf-demo/images/cover.jpg">
    
    <!-- 網頁的網址 -->
    <meta property="og:url" content="https://angelina-sandbox.github.io/pdf-demo/">
    
    <!-- 卡片類型 -->
    <meta property="og:type" content="website">
    
    <title>《千橡》2025年秋 - CCCA JOURNAL No.80</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* 專門為手機與電腦設計的滿版響應式 PDF 容器 */
        .pdf-container {
            width: 100%;
            height: 100vh;
            background-color: #1e1e1e;
        }

        .pdf-object {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="pdf-container">
        <!-- 使用 object 標籤強制手機瀏覽器正確渲染 PDF 尺寸，支援雲端線上串流與流暢上下捲動 -->
        <object data="pdf/CCCA_Magazine_Perfect_Bookmarks_compressed.pdf#view=FitH" type="application/pdf" class="pdf-object">
            <div style="text-align: center; padding: 40px; color: white;">
                <p>您的浏览器暂不支持直接预览 PDF。</p>
                <a href="pdf/CCCA_Magazine_Perfect_Bookmarks_compressed.pdf" style="color: #007aff; font-size: 16px; margin-top: 10px; display: inline-block;">点击此处下载并阅读杂志 PDF</a>
            </div>
        </object>
    </div>

</body>
</html>
